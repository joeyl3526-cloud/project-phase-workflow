<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2520" viewBox="0 0 1660 2520" role="img" aria-labelledby="title desc"><title id="title">GPT 与 OpenCode 模式 A 阶段工作流</title><desc id="desc">以阶段零为顶部主线，展示需求确认、方案、派发、OpenCode 实现自检、GPT 审阅修复闭环，以及增量和最终验收。两侧显示核查时点与中断处理。</desc><defs><marker id="mainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345f9c"/></marker><marker id="branchArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a693c"/></marker></defs><rect width="1660" height="2520" fill="#f6f8fc"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="830" y="65" text-anchor="middle" font-size="38" font-weight="700" fill="#244c80">从需求到交付</text><text x="830" y="105" text-anchor="middle" font-size="21" font-weight="400" fill="#53677f">GPT + OpenCode  ·  模式 A  ·  阶段协作与审阅闭环</text><rect x="510" y="155" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="189" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">阶段 0  ·  需求协商</text><text x="532" y="221" text-anchor="start" font-size="17" font-weight="400" fill="#354962">理解使用场景、澄清歧义与冲突</text><text x="532" y="246" text-anchor="start" font-size="17" font-weight="400" fill="#354962">确认目标、范围、约束和验收标准</text><rect x="510" y="355" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="389" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">阶段 0.5  ·  方案与可行性</text><text x="532" y="421" text-anchor="start" font-size="17" font-weight="400" fill="#354962">设计方案、接口、任务归属及验收方法</text><text x="532" y="446" text-anchor="start" font-size="17" font-weight="400" fill="#354962">检查关键未知与可能导致返工的风险</text><rect x="510" y="555" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="589" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">派发前  ·  GPT 准备任务包</text><text x="532" y="621" text-anchor="start" font-size="17" font-weight="400" fill="#354962">核对授权、前置依赖和文档完整性</text><text x="532" y="646" text-anchor="start" font-size="17" font-weight="400" fill="#354962">明确工作范围、接口、依据及关键反例</text><rect x="510" y="755" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="789" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">执行  ·  GPT 与 OpenCode 分工</text><text x="532" y="821" text-anchor="start" font-size="17" font-weight="400" fill="#354962">GPT 负责前端、架构与跨端契约</text><text x="532" y="846" text-anchor="start" font-size="17" font-weight="400" fill="#354962">OpenCode 实现批准的非前端任务</text><rect x="510" y="955" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="989" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">交回前  ·  OpenCode 自检 / 自审</text><text x="532" y="1021" text-anchor="start" font-size="17" font-weight="400" fill="#354962">检查实现与相关行为；发现问题先自行修复</text><text x="532" y="1046" text-anchor="start" font-size="17" font-weight="400" fill="#354962">自检通过后提交差异、证据和未测项</text><rect x="510" y="1155" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="1189" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">完成回传  ·  桥接核对并接收</text><text x="532" y="1221" text-anchor="start" font-size="17" font-weight="400" fill="#354962">核对任务身份、上下文、回执及成果</text><text x="532" y="1246" text-anchor="start" font-size="17" font-weight="400" fill="#354962">入队或执行成功 ≠ 审阅通过</text><rect x="510" y="1355" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="1389" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">正式审阅  ·  GPT 审查每次交回</text><text x="532" y="1421" text-anchor="start" font-size="17" font-weight="400" fill="#354962">对照原需求、验收标准与实际代码</text><text x="532" y="1446" text-anchor="start" font-size="17" font-weight="400" fill="#354962">检查关键反例，复做必要检查并记录结论</text><rect x="510" y="1555" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="1589" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">审阅判断  ·  PASS / FAIL / BLOCKED</text><text x="532" y="1621" text-anchor="start" font-size="17" font-weight="400" fill="#354962">FAIL：在批准范围内反馈修复意见</text><text x="532" y="1646" text-anchor="start" font-size="17" font-weight="400" fill="#354962">BLOCKED：保留缺口，先处理阻塞</text><rect x="510" y="1755" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="1789" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">阶段 2～n  ·  批准范围内增量</text><text x="532" y="1821" text-anchor="start" font-size="17" font-weight="400" fill="#354962">模式 A：通过后接续已批准的下一任务</text><text x="532" y="1846" text-anchor="start" font-size="17" font-weight="400" fill="#354962">每个增量重复派发、自检、审阅与修复</text><rect x="510" y="1955" width="640" height="125" rx="18" fill="#eaf1fc" stroke="#345f9c" stroke-width="2"/><text x="532" y="1989" text-anchor="start" font-size="21" font-weight="700" fill="#345f9c">最终验收与交付</text><text x="532" y="2021" text-anchor="start" font-size="17" font-weight="400" fill="#354962">对照整体目标和验收标准检查成果</text><text x="532" y="2046" text-anchor="start" font-size="17" font-weight="400" fill="#354962">记录通过、失败、未测范围及用户验收状态</text><path d="M830 280 V345" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 480 V545" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 680 V745" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 880 V945" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 1080 V1145" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 1280 V1345" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 1480 V1545" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 1680 V1745" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><path d="M830 1880 V1945" fill="none" stroke="#345f9c" stroke-width="3" marker-end="url(#mainArrow)"/><rect x="60" y="160" width="380" height="120" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="82" y="194" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">◎ 阶段 0 收尾</text><text x="82" y="226" text-anchor="start" font-size="17" font-weight="400" fill="#354962">用户确认第一版目标</text><text x="82" y="251" text-anchor="start" font-size="17" font-weight="400" fill="#354962">核查需求与验收基线</text><rect x="1220" y="360" width="380" height="120" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="1242" y="394" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">◎ 阶段 0.5 收尾</text><text x="1242" y="426" text-anchor="start" font-size="17" font-weight="400" fill="#354962">核对设计与需求对应关系</text><text x="1242" y="451" text-anchor="start" font-size="17" font-weight="400" fill="#354962">重要缺口先解决再派发</text><rect x="60" y="560" width="380" height="120" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="82" y="594" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">◎ 每次派发之前</text><text x="82" y="626" text-anchor="start" font-size="17" font-weight="400" fill="#354962">保护范围与共享文件归属</text><text x="82" y="651" text-anchor="start" font-size="17" font-weight="400" fill="#354962">模型和上下文按本次授权</text><rect x="60" y="950" width="380" height="145" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="82" y="984" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">↻ 自检不通过</text><text x="82" y="1016" text-anchor="start" font-size="17" font-weight="400" fill="#354962">OpenCode 先自行诊断、修复</text><text x="82" y="1041" text-anchor="start" font-size="17" font-weight="400" fill="#354962">回到实现，再做自检</text><text x="82" y="1066" text-anchor="start" font-size="17" font-weight="400" fill="#354962">自检不等于 GPT 独立审阅</text><rect x="1220" y="1350" width="380" height="155" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="1242" y="1384" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">↻ 审阅不通过 · 修复闭环</text><text x="1242" y="1416" text-anchor="start" font-size="17" font-weight="400" fill="#354962">GPT 交回问题、证据及通过条件</text><text x="1242" y="1441" text-anchor="start" font-size="17" font-weight="400" fill="#354962">OpenCode 修复并重新自检</text><text x="1242" y="1466" text-anchor="start" font-size="17" font-weight="400" fill="#354962">再次回传，由 GPT 复审</text><rect x="60" y="1750" width="380" height="150" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="82" y="1784" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">◎ 暂停 / 中断 / 恢复</text><text x="82" y="1816" text-anchor="start" font-size="17" font-weight="400" fill="#354962">保存任务、上下文和成果身份</text><text x="82" y="1841" text-anchor="start" font-size="17" font-weight="400" fill="#354962">恢复前先核对，不盲目重派</text><text x="82" y="1866" text-anchor="start" font-size="17" font-weight="400" fill="#354962">中断需按规则处理</text><rect x="1220" y="1750" width="380" height="150" rx="18" fill="#fffaf3" stroke="#ad7d4e" stroke-width="2"/><text x="1242" y="1784" text-anchor="start" font-size="21" font-weight="700" fill="#ad7d4e">◎ 接续条件</text><text x="1242" y="1816" text-anchor="start" font-size="17" font-weight="400" fill="#354962">A 模式仅在批准范围内推进</text><text x="1242" y="1841" text-anchor="start" font-size="17" font-weight="400" fill="#354962">重要取舍、阻塞或暂停时</text><text x="1242" y="1866" text-anchor="start" font-size="17" font-weight="400" fill="#354962">依据授权和状态处理</text><path d="M510 215 H450" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M1150 420 H1210" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M510 615 H450" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M510 1015 H450" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M1150 1410 H1210" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M510 1815 H450" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M1150 1815 H1210" fill="none" stroke="#9a693c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#branchArrow)"/><path d="M250 950 V820 H500" fill="none" stroke="#9a693c" stroke-width="3" marker-end="url(#branchArrow)"/><text x="260" y="850" text-anchor="start" font-size="16" font-weight="400" fill="#8a5b30">修复后重新执行</text><path d="M1410 1350 V815 H1160" fill="none" stroke="#9a693c" stroke-width="3" marker-end="url(#branchArrow)"/><text x="1280" y="800" text-anchor="start" font-size="16" font-weight="400" fill="#8a5b30">修复意见 → OpenCode</text><path d="M1150 1615 H1190 V1515 H1210" fill="none" stroke="#9a693c" stroke-width="3" marker-end="url(#branchArrow)"/><text x="1192" y="1585" text-anchor="start" font-size="16" font-weight="700" fill="#8a5b30">FAIL</text><path d="M510 1815 H475 V615 H500" fill="none" stroke="#9a693c" stroke-width="3" marker-end="url(#branchArrow)"/><text x="65" y="1695" text-anchor="start" font-size="16" font-weight="400" fill="#8a5b30">下一增量：回到派发</text><text x="830" y="2195" text-anchor="middle" font-size="20" font-weight="700" fill="#244c80">图中展示：GPT + OpenCode · 模式 A</text><text x="830" y="2230" text-anchor="middle" font-size="17" font-weight="400" fill="#53677f">纯 GPT：由 GPT 实现并检查；模式 B：阶段审阅后等待用户指示。</text><text x="830" y="2270" text-anchor="middle" font-size="17" font-weight="400" fill="#53677f">设计目标：更准确地理解需求、减少返工、支持多轮接续并降低 GPT 实现负担。</text></g></svg>